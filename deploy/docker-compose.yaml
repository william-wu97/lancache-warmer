# ============================================================
#  lancache-warmer 独立部署
#
#  设计：与现有的 lancache / cache-manager 并行运行，不抢端口。
#  验证通过后，再把 cache-manager 停掉、warmer 改回 8080。
#
#  部署位置：/volume1/lancache/warmer
#  启动：
#    unc docker compose up --name lancache-warmer \
#        --path /volume1/lancache/warmer \
#        --from-file /volume1/lancache/warmer/docker-compose.yaml --run --yes
# ============================================================

services:
  warmer:
    # 不用 build：NAS 的 compose 项目不支持 build:，会直接 EXITED
    image: node:24-bookworm
    container_name: lancache-warmer
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["/bin/bash", "/app/deploy/start.sh"]
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      NAS_IP: "192.168.31.3"
      APP_DIR: /app
      # 变量名必须和 src/config.js 一致，否则会静默 fallback 到默认路径
      WARMER_DATA_DIR: /app/data
      # 指向 lancache 真正的缓存根（nginx 的 hash 分片目录在这里面）
      CACHE_DATA_DIR: /cache/cache
      # SteamPrefill 的账本目录：successfullyDownloadedDepots.json 在这里
      PREFILL_STATE_DIR: /prefill
      # 旧 Python 面板的数据目录：迁移下载历史用
      LEGACY_STATE_DIR: /legacy
      OS_FILTER: windows
      CONCURRENCY: "16"
      # 排查 CM 连接时临时打开
      STEAM_DEBUG: "1"
    ports:
      # 对外 8082，避免和现有 cache-manager 的 8080 冲突
      - "8082:8080"
    volumes:
      - /volume1/lancache/warmer:/app
      # 只读挂载缓存目录：warmer 不写缓存，只读来统计
      - /volume1/lancache/data:/cache:ro
      # SteamPrefill 的状态目录：读它记录的已下载 depot 清单（只读）
      - /volume2/docker/steam-prefill:/prefill:ro
      # 旧面板的 history.json（只读）
      - /volume2/docker/steam-cache-manager/data:/legacy:ro
    dns:
      # 主 DNS 指向本机 dnsmasq：chunk 请求才会落到 lancache（否则走公网，
      # 缓存一个字节都填不进去）。
      # 但 dnsmasq 只劫持 steamcontent.com，其余域名靠它转发；一旦转发失败，
      # steam-user 连 CM 就会超时，所以必须带一个公共 DNS 兜底。
      - 192.168.31.3
      - 223.5.5.5
    networks:
      - lancache

networks:
  lancache:
    external: true
    name: lancache
